name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: mcp_auth_db
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio

    - name: Install PostgreSQL client
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    - name: Run Database Init
      run: |
        export PGPASSWORD=password123
        psql -h localhost -p 5433 -U admin -d mcp_auth_db -f init.sql
        
    - name: Seed Database Vectors
      run: |
        python seed_vectors.py
        
    - name: Run Tests
      run: |
        export GROQ_API_KEY="dummy-key-for-ci"
        python server.py &
        timeout 60 bash -c 'until curl -s http://localhost:8000/health > /dev/null; do sleep 2; done'
        pytest test_rls.py -v
