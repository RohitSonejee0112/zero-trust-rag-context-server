<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Trust RAG Context Server</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Outfit:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <div class="container glass-panel">
        <header>
            <h1>Zero-Trust RAG</h1>
            <p>PostgreSQL Row-Level Security (RLS) + Vector Semantic Search</p>
        </header>

        <main>
            <div class="control-panel">
                <div class="user-selector">
                    <label>Login as:</label>
                    <select id="userSelect">
                        <option value="alice_hr">👩‍💼 Alice (HR Manager)</option>
                        <option value="david_hr">👦 David (HR Intern)</option>
                        <option value="bob_eng">👨‍💻 Bob (Eng Manager)</option>
                        <option value="charlie_fin">🕴️ Charlie (Finance Manager)</option>
                    </select>
                </div>
            </div>

            <div class="chat-container">
                <div class="chat-history" id="chatHistory">
                    <div class="message system-msg">
                        <div class="msg-bubble">
                            <span class="icon">🛡️</span>
                            Welcome. Please ask a question. Documents are filtered at the kernel level via Postgres RLS before being handed to the LLM.
                        </div>
                    </div>
                </div>

                <form id="chatForm" class="input-area">
                    <input type="text" id="queryInput" placeholder="Ask about 'engineering salary bands'..." required autocomplete="off">
                    <button type="submit" id="sendBtn">
                        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" class="send-icon"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </form>
            </div>
        </main>
        
        <footer>
            <p>Built with <span>FastAPI</span>, <span>Groq</span>, and <span>pgvector</span></p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
